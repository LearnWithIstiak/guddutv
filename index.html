<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium IPTV Pro</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
    display: flex;
    height: 100vh;
}

/* MOBILE HEADER */
.mobile-header {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    background: #111827;
    align-items: center;
    padding: 0 10px;
    z-index: 1000;
}

.mobile-header button {
    font-size: 22px;
    background: none;
    border: none;
    color: white;
}

.mobile-header .title {
    margin-left: 10px;
    font-weight: bold;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: rgba(17, 24, 39, 0.95);
    padding: 12px;
    overflow-y: auto;
}

h2 { font-size: 18px; }

.search {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
}

.channel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin: 6px 0;
    background: #1f2937;
    border-radius: 10px;
    cursor: pointer;
}

.channel:hover { background: #374151; }
.channel.active { background: #2563eb; }

.heart { cursor: pointer; }

/* PLAYER */
.player {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

video {
    width: 92%;
    max-height: 80vh;
    border-radius: 14px;
    background: black;
}

/* CONTROLS */
.controls {
    margin-top: 10px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover { background: #1d4ed8; }

/* MOBILE */
@media (max-width: 768px) {

    .mobile-header { display: flex; }

    body { flex-direction: column; }

    .sidebar {
        position: fixed;
        top: 50px;
        left: -260px;
        height: calc(100% - 50px);
        transition: 0.3s;
        z-index: 999;
    }

    .sidebar.open { left: 0; }

    .player { margin-top: 50px; width: 100%; }

    video { width: 100%; border-radius: 0; }

    .controls {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.85);
        padding: 10px;
        justify-content: center;
    }

    button { flex: 1; font-size: 14px; }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="mobile-header">
    <button onclick="toggleMenu()">☰</button>
    <div class="title">📺 তাকবো না, টিভি</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>📺 Channels</h2>
    <input class="search" placeholder="Search..." oninput="searchChannels(this.value)">
    <div id="channelList"></div>
</div>

<!-- PLAYER -->
<div class="player">
    <video id="video" controls autoplay></video>

    <div class="controls">
        <button onclick="togglePiP()">PiP</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button onclick="changeSpeed()">Speed</button>
    </div>
</div>

<script>
const channels = [
    { name: "Bein Sports 4", url: "https://andro.226503.xyz/checklist/androstreamlivebs4.m3u8" },
    { name: "Bein Sports", url: "https://bein-esp-xumo.amagi.tv/playlistR720P.m3u8" },
    { name: "Go LIVE", url: "https://d1211whpimeups.cloudfront.net/smil:rtbgo/chunklist_b1120000_sleng.m3u8" },
    { name: "Somoy TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/1702-audio_113322_eng=113200-video=2202800.m3u8" },
    { name: "Sky Sports Cricket", url: "http://185.246.209.113/SkySportsCricket/index.m3u8" },
    { name: "PTV Sports", url: "https://tvsen5.aynaott.com/PtvSports/tracks-v1a1/mono.ts.m3u8" }
];

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let currentSpeed = 1;
const video = document.getElementById("video");
let hls;

/* MENU */
function toggleMenu() {
    document.querySelector(".sidebar").classList.toggle("open");
}

/* RENDER */
function renderChannels(list = channels) {
    const container = document.getElementById("channelList");
    container.innerHTML = "";

    list.forEach((ch, index) => {
        const isFav = favorites.includes(ch.name);

        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = `
            <span>${ch.name}</span>
            <span class="heart">${isFav ? "❤️" : "🤍"}</span>
        `;

        div.onclick = () => loadChannel(index);

        div.querySelector(".heart").onclick = (e) => {
            e.stopPropagation();
            toggleFavorite(ch.name);
        };

        container.appendChild(div);
    });
}

/* LOAD CHANNEL */
function loadChannel(index) {

    document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
    document.querySelectorAll(".channel")[index]?.classList.add("active");

    const url = channels[index].url;

    if (hls) hls.destroy();

    if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }

    video.play();
}

/* FAVORITES */
function toggleFavorite(name) {
    if (favorites.includes(name)) {
        favorites = favorites.filter(f => f !== name);
    } else {
        favorites.push(name);
    }
    localStorage.setItem("favorites", JSON.stringify(favorites));
    renderChannels();
}

/* SEARCH */
function searchChannels(query) {
    const filtered = channels.filter(c =>
        c.name.toLowerCase().includes(query.toLowerCase())
    );
    renderChannels(filtered);
}

/* PiP */
function togglePiP() {
    if (document.pictureInPictureElement) {
        document.exitPictureInPicture();
    } else {
        video.requestPictureInPicture();
    }
}

/* FULLSCREEN */
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

/* SPEED */
function changeSpeed() {
    const speeds = [0.75, 1, 1.25, 1.5, 2];
    let i = speeds.indexOf(currentSpeed);
    currentSpeed = speeds[(i + 1) % speeds.length];
    video.playbackRate = currentSpeed;
    alert("Speed: " + currentSpeed + "x");
}

/* INIT */
renderChannels();
loadChannel(0);
</script>

</body>
</html>
